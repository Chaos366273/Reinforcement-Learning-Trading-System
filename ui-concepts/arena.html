<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Arena · PathRise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="site.css">
<style>
  .arena-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; top: 58px; z-index: 15; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); padding: 8px 0; }
  .scrub { width: 100%; accent-color: var(--gold); }
  .playbar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
<div class="app"><main class="page" id="main"></main></div>
<script src="shared.js"></script><script src="site.js"></script>
<script src="fixtures/run.js"></script>
<script>
PR.bootSite({ shell: true, active: "training" });
const q = new URLSearchParams(location.search);
const dev = q.has("dev");
let mode = q.get("state") || (q.get("start") ? "queued" : "running");
let speed = 1, cursor = 0, timer = null, scrub = 12, playing = false, playTimer = null, compare = false;
if (mode === "finished" || mode === "failed" || mode === "paused" || mode === "offline") cursor = window.QUICK_RUN.length;
const events = window.QUICK_RUN;
const stages = ["data","mentor","practice","exam","report"];
function seen() { return events.slice(0, cursor); }
function last(type) { return [...seen()].reverse().find((e) => e.type === type); }
function rolls() { return seen().filter((e) => e.type === "rollout.metrics"); }
function healthOf(roll) {
  if (!roll) return ["info", "Starting", "Waiting for the first rollout."];
  if (roll.hold > 0.75) return ["bad", "Stuck", "It is holding almost everything. That is the policy, not the gate."];
  if ((roll.train_ret - roll.val_ret) > 2) return ["warn", "Overfitting", "Training looks better than the exam window."];
  if (roll.ep_rew_mean < 0 && cursor > 4) return ["warn", "Needs more time", "Reward is still flat. Give it another rollout."];
  return ["ok", "Learning well", "Reward is rising and the exam is keeping up."];
}
function paint() {
  const st = last("stage.changed");
  const stage = mode === "finished" ? "report" : (st ? st.stage : "data");
  const roll = rolls().at(-1);
  const step = roll ? roll.step : 0;
  const total = 20000;
  const coaches = seen().filter((e) => e.type === "coach.event");
  const shown = PR.isPro() ? coaches : coaches.slice(-3);
  const ckpts = seen().filter((e) => e.type === "checkpoint.saved");
  const health = healthOf(roll);
  const banner = {
    queued: `<div class="banner info" role="status">Queued. You can leave this tab. The plan is frozen for this run.</div>`,
    loading: `<div class="card"><div class="card-b" style="display:grid;gap:8px"><div class="skeleton" style="height:18px;width:40%"></div><div class="skeleton" style="height:220px"></div></div></div>`,
    paused: `<div class="banner warn" role="status">Paused at step ${step.toLocaleString()}. The best checkpoint so far stays saved.</div>`,
    failed: `<div class="banner" role="alert">${window.RUN_FAIL[0].message} <button class="btn btn-sm" id="resume">Resume from ckpt_3</button> <a class="btn btn-sm" href="training.html">Edit the plan</a></div>`,
    offline: `<div class="banner" role="alert">Stream interrupted. Reconnecting from step ${step.toLocaleString()}. A phone can resume with the last event id.</div>`,
    finished: `<div class="verdict"><div class="eyebrow">Exam verdict</div><h2>It learned to trade less randomly.</h2><p style="margin:0">Held-out return <b class="num">+2.1%</b> against buy-and-hold. <a href="report.html">Open the report card</a></p></div>`
  }[mode] || "";
  const devBar = dev ? `<div class="seg" id="modes">${["queued","loading","running","paused","failed","offline","finished"].map((m)=>`<button data-m="${m}" class="${m===mode?"on":""}">${m}</button>`).join("")}</div>` : "";
  document.getElementById("main").innerHTML = `
    <div class="page-head"><div><h1>Arena</h1><p><a href="training.html">Training plan</a> · one line, not a second copy</p></div></div>
    <a class="status-strip" href="training.html"><span class="pill gold"><i></i>${health[1]}</span><span>Quick · Balanced · ${Math.min(step, total).toLocaleString()} / ${total.toLocaleString()}</span><b>Edit plan</b></a>
    <div class="arena-top">
      <div class="steps">${stages.map((s) => `<span class="step-pip ${s===stage?"on":""} ${stages.indexOf(s)<stages.indexOf(stage)?"done":""}"><span class="n">${stages.indexOf(s)+1}</span>${s}</span>`).join("")}</div>
      <span class="pill ${mode==="failed"?"down":mode==="finished"?"up":"gold"}"><i></i>${mode}</span>
      <span style="flex:1"></span>
      <button class="btn btn-sm" id="pause">${mode==="paused"?"Resume":"Pause"}</button>
      <button class="btn btn-sm" id="stop">Stop and keep best</button>
      <button class="btn btn-sm" id="branch">Branch</button>
      <button class="btn btn-sm" id="share">Share</button>
    </div>
    ${devBar}
    ${mode === "running" ? "" : banner}
    <div class="grid-main" style="${mode === "loading" || mode === "queued" ? "display:none" : ""}">
      <section class="card"><div class="card-h"><h2>The Gym</h2><span class="sub">NVDA replay</span></div>
        <div class="card-b"><div class="chart" id="gym"></div>
          <input class="scrub" id="scrub" type="range" min="2" max="70" value="${scrub}" aria-label="Replay position">
          <div class="playbar">
            <button class="btn btn-sm" id="gplay">${playing ? "Pause replay" : "Play replay"}</button>
            <button class="btn btn-sm" id="back1">Step back</button>
            <button class="btn btn-sm" id="fwd1">Step forward</button>
            <button class="btn btn-sm" data-sp="1">1×</button>
            <button class="btn btn-sm" data-sp="2">2×</button>
            <button class="btn btn-sm" data-sp="4">4×</button>
            <button class="btn btn-sm" data-sp="8">8×</button>
            <button class="btn btn-sm" id="jump">Jump to trade</button>
          </div>
          <p class="muted" style="font-size:12.5px">Strategy <b class="num" id="epnl">—</b> · buy-and-hold <b class="num" id="bh">—</b></p>
          <div class="chart" id="gym-eq"></div>
          <button class="btn btn-sm" id="cmp">${compare ? "Hide checkpoint compare" : "Compare early vs later"}</button>
          <div id="cmpbox"></div>
        </div></section>
      <section style="display:grid;gap:16px">
        <section class="card"><div class="card-h"><h2 id="curve-title">${PR.isPro() ? "ep_rew_mean" : "Is it learning?"}</h2>
          <div class="seg" id="metric" data-mode-only="pro">
            <button data-k="ep_rew_mean" class="on" title="Average reward. Rising means it is learning.">Reward</button>
            <button data-k="ep_len" title="Episode length. Here it stays on the session window.">Length</button>
            <button data-k="approx_kl" title="How big the PPO update was. Small and stable is healthy. A spike means the update was too large.">approx_kl</button>
            <button data-k="entropy" title="How unsure the policy is. Collapsing toward zero means it stopped exploring.">Entropy</button>
            <button data-k="ev" title="Explained variance. Near 1 means the value head understands returns.">Value fit</button>
          </div></div>
          <div class="card-b"><div class="chart" id="curve"></div>
            <p data-mode-only="simple" class="muted">You do not need the raw names. The verdict on the right is the reading: learning, needs time, stuck, or overfitting.</p>
            <p data-mode-only="pro" class="muted" id="band">Healthy PPO: reward rising, approx_kl small, entropy not stuck at zero.</p>
          </div></section>
        <section class="card"><div class="card-h"><h2>Behaviour mix</h2><span class="sub">BUY / HOLD / SELL</span></div><div class="card-b"><div id="mix" style="display:grid;gap:6px"></div>
          <p class="muted" style="font-size:12.5px">The mark at 12,288 is the entropy boost, after HOLD jumped.</p></div></section>
      </section>
      <aside style="display:grid;gap:16px;align-content:start">
        <div class="health ${health[0]==="ok"?"ok":health[0]==="bad"?"bad":health[0]==="warn"?"warn":"info"}"><div><b>${health[1]}</b><div>${health[2]}</div>${health[0]==="bad"?`<a class="btn btn-sm" href="training.html?retrain=cautious" style="margin-top:8px">Branch a calmer plan</a>`:""}</div></div>
        <section class="card"><div class="card-h"><h2>Coach</h2></div><div class="card-b coach">${shown.length?shown.map((c)=>`<div class="ev"><small>Step ${c.step.toLocaleString()}</small>${c.text}</div>`).join(""):`<div class="ev">The coach speaks when a callback changes the run.</div>`}</div></section>
        <section class="card" data-mode-only="pro"><div class="card-h"><h2>Checkpoints</h2></div><div class="card-b">${ckpts.map((c)=>`<div class="ck"><span><b class="num">${c.id}</b><br><span class="muted">step ${c.step.toLocaleString()} · ${c.note}</span></span><a class="btn btn-sm" href="training.html?from=${c.id}">Branch</a></div>`).join("")||`<span class="muted">None yet.</span>`}
          <p class="muted">Latest BUY probabilities: NVDA 0.48 · MSFT 0.22 · JPM 0.14. The rest are under the gate.</p>
          <button class="btn btn-sm" id="export">Export JSONL</button>
        </div></section>
      </aside>
    </div>`;
  bind();
  PR.stampMode();
}
function bind() {
  const modes = document.getElementById("modes");
  if (modes) modes.onclick = (e) => { const b = e.target.closest("[data-m]"); if (!b) return; mode = b.dataset.m; if (mode==="running") play(); else { stop(); if (mode!=="queued" && mode!=="loading") { cursor = events.length; } } paint(); };
  const p = document.getElementById("pause");
  if (p) p.onclick = () => { if (mode==="paused") { mode="running"; play(); } else { mode="paused"; stop(); } paint(); };
  const s = document.getElementById("stop");
  if (s) s.onclick = () => { mode="finished"; stop(); PR.toast("Stopped. Best checkpoint ckpt_8 is kept."); paint(); };
  const r = document.getElementById("resume");
  if (r) r.onclick = () => { mode="running"; cursor=Math.max(cursor,4); play(); paint(); };
  const br = document.getElementById("branch");
  if (br) br.onclick = () => { location.href = "training.html?from=ckpt_8"; };
  const sh = document.getElementById("share");
  if (sh) sh.onclick = () => { navigator.clipboard?.writeText(location.origin + location.pathname + "?state=finished").catch(()=>{}); PR.toast("Replay link copied."); };
  const ex = document.getElementById("export");
  if (ex) ex.onclick = () => PR.download("quick-train.jsonl", events.map((e) => JSON.stringify(e)).join("\n"), "application/x-ndjson");
  document.querySelectorAll("[data-sp]").forEach((b) => b.onclick = () => { speed = +b.dataset.sp; if (playing) { playing = false; startReplay(); } });
  const sc = document.getElementById("scrub");
  if (sc) sc.oninput = () => { scrub = +sc.value; drawGym(); };
  const met = document.getElementById("metric");
  if (met) met.onclick = (e) => { const b = e.target.closest("[data-k]"); if (!b) return; met.querySelectorAll("button").forEach((x)=>x.classList.toggle("on", x===b)); drawCurve(b.dataset.k); document.getElementById("curve-title").textContent = b.title.split(".")[0]; };
  const gp = document.getElementById("gplay");
  if (gp) gp.onclick = () => startReplay();
  const back = document.getElementById("back1");
  const fwd = document.getElementById("fwd1");
  if (back) back.onclick = () => { scrub = Math.max(2, scrub - 1); syncScrub(); };
  if (fwd) fwd.onclick = () => { scrub = Math.min(70, scrub + 1); syncScrub(); };
  const jump = document.getElementById("jump");
  if (jump) jump.onclick = () => { scrub = 36; syncScrub(); };
  const cmp = document.getElementById("cmp");
  if (cmp) cmp.onclick = () => { compare = !compare; paint(); };
  draw();
}
function syncScrub() {
  const sc = document.getElementById("scrub");
  if (sc) sc.value = scrub;
  drawGym();
}
function startReplay() {
  playing = !playing;
  if (playTimer) clearInterval(playTimer);
  const btn = document.getElementById("gplay");
  if (btn) btn.textContent = playing ? "Pause replay" : "Play replay";
  if (!playing) return;
  playTimer = setInterval(() => {
    if (scrub >= 70) { playing = false; clearInterval(playTimer); if (document.getElementById("gplay")) document.getElementById("gplay").textContent = "Play replay"; return; }
    scrub += 1; syncScrub();
  }, Math.max(80, 420 / speed));
}
function draw() { drawCurve("ep_rew_mean"); drawGym(); drawMix(); drawCompare(); }
function valueOf(r, key) {
  if (key === "ev") return Math.max(-0.2, Math.min(0.95, 1 - r.value_loss));
  if (key === "ep_len") return r.ep_len;
  if (key === "approx_kl") return r.approx_kl;
  return r[key];
}
function drawCurve(key) {
  const el = document.getElementById("curve"); if (!el) return;
  const rs = rolls();
  if (rs.length < 2) { el.innerHTML = `<p class="muted">The curve appears after the second rollout.</p>`; return; }
  const a = rs.map((r) => valueOf(r, key));
  el.innerHTML = "";
  PR.lineChart(el, { id: "cv"+key+cursor, height: 200, series: [{ data: a, color: "--gold", w: 2.2 }], xlabels: ["0", rs.at(-1).step.toLocaleString()], fmt: (v)=>v.toFixed(2), tip: (i)=>`<div class="num">${a[i].toFixed(3)}</div>` });
  const band = document.getElementById("band");
  if (band && key === "approx_kl") band.textContent = "This run stays near 0.008. That is small and stable. A jump toward 0.05 would mean the update is too large.";
}
function replaySrc() {
  return [...events].reverse().find((e)=>e.replay);
}
function drawGym() {
  const el = document.getElementById("gym"); if (!el) return;
  const replay = replaySrc();
  if (!replay) return;
  const all = replay.replay.prices;
  const prices = all.slice(0, Math.max(2, scrub));
  const marks = replay.replay.trades.filter((t)=>t.i < prices.length);
  el.innerHTML = "";
  PR.lineChart(el, { id: "gym"+scrub, height: 200, series: [{ data: prices, color: "--hold", w: 2 }], markers: marks.map((m)=>({i:m.i,a:m.a,p:m.p})), xlabels: ["09:30","12:00","15:30"], fmt: (v)=>"$"+v.toFixed(0), tip: (i)=>`<div class="num">${PR.usd(prices[i])}</div>` });
  let pos = 0, cash = 0;
  const strat = [];
  prices.forEach((p, i) => {
    const m = marks.find((t) => t.i === i);
    if (m && m.a === "BUY") { pos += 10; cash -= 10 * m.p; }
    if (m && m.a === "SELL") { cash += pos * m.p; pos = 0; }
    strat.push(cash + pos * p);
  });
  const p0 = all[0];
  const bh = prices.map((p) => (p - p0) * 10);
  const eq = document.getElementById("gym-eq");
  if (eq) {
    eq.innerHTML = "";
    PR.lineChart(eq, { id: "eq"+scrub, height: 120, area: false, series: [{ data: strat, color: "--gold", w: 2 }, { data: bh, color: "--muted", w: 1.4, dash: true }], xlabels: ["Open", "Now"], fmt: (v)=>PR.usd(v,0), tip: (i)=>`<div class="num">Bot ${PR.usd(strat[i],0)}</div><div class="num">Buy & hold ${PR.usd(bh[i],0)}</div>` });
  }
  const pnl = document.getElementById("epnl");
  const bhEl = document.getElementById("bh");
  if (pnl) { pnl.textContent = PR.usd(strat.at(-1) || 0, 0); pnl.className = "num " + PR.cls(strat.at(-1) || 0); }
  if (bhEl) { bhEl.textContent = PR.usd(bh.at(-1) || 0, 0); bhEl.className = "num " + PR.cls(bh.at(-1) || 0); }
}
function drawCompare() {
  const box = document.getElementById("cmpbox"); if (!box || !compare) { if (box) box.innerHTML = ""; return; }
  const replay = replaySrc(); if (!replay) return;
  const prices = replay.replay.prices;
  const early = prices.map(() => prices[0]);
  box.innerHTML = `<div class="grid-2" style="margin-top:10px"><section><div class="eyebrow">ckpt_3 · early</div><p class="muted">Mostly HOLD. The line barely leaves the open.</p><div class="chart" id="early"></div></section><section><div class="eyebrow">ckpt_8 · later</div><p class="muted">Same window, after the entropy boost. It buys the trend and sells into strength.</p><div class="chart" id="late"></div></section></div>`;
  PR.lineChart(document.getElementById("early"), { id: "early", height: 140, series: [{ data: early, color: "--hold", w: 2 }], xlabels: ["Open","Close"], fmt: (v)=>"$"+v.toFixed(0), tip: ()=>`<div>No trade</div>` });
  PR.lineChart(document.getElementById("late"), { id: "late", height: 140, series: [{ data: prices, color: "--gold", w: 2 }], markers: replay.replay.trades.map((m)=>({i:m.i,a:m.a,p:m.p})), xlabels: ["Open","Close"], fmt: (v)=>"$"+v.toFixed(0), tip: (i)=>`<div class="num">${PR.usd(prices[i])}</div>` });
}
function drawMix() {
  const el = document.getElementById("mix"); if (!el) return;
  el.innerHTML = rolls().map((r)=>`<div style="display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center"><span class="num muted">${(r.step/1000).toFixed(0)}k${r.step===12288?" ·":""}</span><div class="mix" title="BUY ${(r.buy*100).toFixed(0)}% HOLD ${(r.hold*100).toFixed(0)}% SELL ${(r.sell*100).toFixed(0)}%" style="${r.step===12288?"outline:1px solid var(--gold);outline-offset:2px":""}"><i style="width:${r.buy*100}%;background:var(--up)"></i><i style="width:${r.hold*100}%;background:var(--hold)"></i><i style="width:${r.sell*100}%;background:var(--down)"></i></div></div>`).join("");
}
function play() { stop(); timer = setInterval(() => { if (cursor < events.length) { cursor++; paint(); } else { mode = "finished"; stop(); paint(); } }, 900/speed); }
function stop() { if (timer) clearInterval(timer); timer = null; }
if (mode === "queued") setTimeout(() => { mode = "loading"; paint(); setTimeout(() => { mode = "running"; cursor = 2; play(); }, 800); }, 700);
else if (mode === "running") { cursor = 3; play(); }
else paint();
document.addEventListener("pr:mode", () => paint());
</script>
</body>
</html>
