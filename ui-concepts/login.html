<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · PathRise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="site.css">
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script><script src="site.js"></script>
<script>
const states = {
  ready: "",
  bad: `<div class="banner" role="alert">That email and password do not match. You can reset the password or try the demo.</div>`,
  locked: `<div class="banner" role="alert">This desk is locked after 5 failed tries. Try again in 15 minutes, or reset the password.</div>`,
  limit: `<div class="banner warn" role="alert">Too many attempts from this network. Wait a minute, then try once.</div>`,
  offline: `<div class="banner info" role="status">You are offline. The form is kept. It will send when the connection returns.</div>`
};
let state = "ready", busy = false;
function paint() {
  document.getElementById("root").innerHTML = PR.authFrame({
    title: "Welcome back",
    lead: "Paper session. Your bots and checkpoints stay on this desk.",
    banner: states[state],
    body: `<div class="sso"><button class="btn" data-soon="Google">Google</button><button class="btn" data-soon="Passkey">Passkey</button></div>
      <div class="or">or email</div>
      <form id="f">
        <div class="field ${state === "bad" ? "bad" : ""}"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" value="faisal@pathrise.dev" required><span class="err">Check the email and password.</span></div>
        <div class="field pw"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" value="paper-session" required><button type="button" data-toggle-pw="pw">Show</button></div>
        <div style="display:flex;justify-content:space-between;align-items:center"><a href="forgot.html">Forgot password</a><a href="twofa.html">Use a backup code</a></div>
        <button class="btn btn-gold" type="submit" ${busy ? "disabled" : ""}>${busy ? "Checking…" : "Log in"}</button>
      </form>
      <div class="proto-note">Preview a state: <span id="st"></span></div>`,
    foot: `New here? <a href="signup.html">Create a desk</a> · <a href="arena.html?demo=1">Try the demo without signing up</a>`
  });
  PR.hydrate();
  document.getElementById("st").innerHTML = Object.keys(states).map((k) => `<button class="btn btn-sm ${k === state ? "btn-gold" : ""}" data-st="${k}">${k}</button>`).join(" ");
  document.getElementById("st").onclick = (e) => { const b = e.target.closest("[data-st]"); if (!b) return; state = b.dataset.st; busy = false; paint(); PR.bootSite({ dock: false }); };
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    if (state === "offline") return PR.toast("Saved. We will retry when you are back online.");
    if (state === "locked" || state === "limit" || state === "bad") return;
    busy = true; paint(); PR.bootSite({ dock: false });
    setTimeout(() => { location.href = "desk.html"; }, 400);
  };
}
paint();
PR.bootSite({ dock: false });
</script>
</body>
</html>
