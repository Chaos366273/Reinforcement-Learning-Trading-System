<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk · PathRise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="site.css">
</head>
<body>
<div class="app"><main class="page" id="main"></main></div>
<script src="shared.js"></script><script src="site.js"></script>
<script>
const q = new URLSearchParams(location.search);
let view = q.get("empty") ? "empty" : (q.get("state") || "live");
function render() {
  if (view === "empty") {
    document.getElementById("main").innerHTML = `<section class="card state-card" style="display:flex"><div class="state-ico"><span data-i="agent" data-s="26"></span></div><h3>No bot yet</h3><p>Build your first bot with a template, or watch the demo learn before you spend a credit.</p><div class="state-actions"><a class="btn btn-gold" href="training.html">Build your first bot</a><a class="btn" href="arena.html?demo=1">Watch the demo</a></div></section>`;
    PR.hydrate(); return;
  }
  if (view === "offline") {
    document.getElementById("main").innerHTML = `<div class="banner" role="alert">The desk stream dropped at 15:41 ET. Paper stops are still live at the broker. <button class="btn btn-sm" id="retry">Retry</button></div>` + live();
    document.getElementById("retry").onclick = () => { view = "live"; render(); charts(); };
    return;
  }
  document.getElementById("main").innerHTML = live();
  PR.stampMode();
}
function live() {
  const dev = new URLSearchParams(location.search).has("dev");
  const strip = `<a class="status-strip" href="arena.html"><span class="pill gold"><i></i>Learning well</span><span>Quick Train · step 12,288 of 20,000 · about 4 min left</span><b>Open Arena</b></a>`;
  const devBar = dev ? `<div class="seg" id="views"><button data-v="live">Live</button><button data-v="collapse">HOLD collapse</button><button data-v="offline">Stream down</button><button data-v="empty">Empty</button></div>` : "";
  const simple = `<section data-mode-only="simple" class="grid-2">
      <section class="card"><div class="card-b"><div class="eyebrow">Today</div><div class="num up" style="font-size:32px">+${PR.usd(PR.data.dayPnl, 0)}</div><p style="margin:8px 0 0">The bot bought NVDA this morning because volume was unusually high, then left it alone. It is not adding more: that name is already a large slice of the book.</p><a class="btn btn-gold btn-sm" href="explainer.html">Why NVDA</a></div></section>
      <section class="card"><div class="card-h"><h2>Needs a look</h2></div><div class="card-b" style="display:grid;gap:8px">
        <div class="health warn"><div><b>Paper days still open</b><div>Live routing stays off until the checklist is done.</div></div></div>
        <div class="health ok"><div><b>Stops are armed</b><div>A winner is sold if it gives back 8% from its high.</div></div></div>
        <div class="health info"><div><b>META was skipped</b><div>The signal was too weak, so the bot waited.</div></div></div>
      </div></section>
    </section>`;
  const pro = `<div data-mode-only="pro" class="grid-main">
      <section class="card"><div class="card-h"><h2>Universe</h2><span class="sub">30 · today</span></div><div class="card-b"><div class="uni" id="uni" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px"></div>
        <table class="tbl" id="uni-table" style="margin-top:10px"><thead><tr><th data-sort="s">Name</th><th class="r" data-sort="d">Day</th><th>Held</th></tr></thead><tbody></tbody></table>
      </div></section>
      <section class="card"><div class="card-h"><h2>Agent decision</h2><span class="pill gold"><i></i>PPO · TCN</span></div>
        <div class="card-b"><div class="eyebrow">Bull trend · vol 1.4%</div><h2 style="margin:4px 0">BUY <span class="muted" style="font-size:14px">conf 0.31</span></h2>
        <p>Wants to add NVDA, but it is already <b>7.2% of a 15% cap</b>. No order. Trailing stop stays armed at $115.28.</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill up"><i></i>High gate 18</span><span class="pill hold"><i></i>Medium 7</span><span class="pill down"><i></i>Blocked 4</span></div>
        <div style="display:flex;gap:8px;margin-top:12px"><a class="btn btn-gold btn-sm" href="explainer.html">Why this decision</a><button class="btn btn-sm" id="ask">Ask Clawbot</button></div></div></section>
      <section class="card"><div class="card-h"><h2>Risk budget</h2><span class="pill up"><i></i>Inside limits</span></div>
        <div class="card-b" style="display:grid;gap:10px"><div><div style="display:flex;justify-content:space-between"><span class="muted">Gross</span><b class="num">41% / 100%</b></div><div class="meter"><i style="width:41%;background:var(--gold)"></i></div></div>
        <div><div style="display:flex;justify-content:space-between"><span class="muted">Largest name</span><b class="num">7.2% / 15%</b></div><div class="meter"><i style="width:48%;background:var(--up)"></i></div></div>
        <div><div style="display:flex;justify-content:space-between"><span class="muted">Drawdown</span><b class="num">−1.8% / −25%</b></div><div class="meter"><i style="width:7%;background:var(--up)"></i></div></div></div></section>
    </div>`;
  return `<div class="page-head"><div><h1>Desk</h1><p>Balanced bot · paper</p></div>
    <span class="pill up live"><i></i>Market open</span>${devBar}</div>
    ${strip}
    ${view === "collapse" ? `<div class="banner warn" role="status">The bot is holding about 94% of the time. That is a training issue, not the gate. <a href="arena.html">Open the Arena</a>.</div>` : ""}
    ${simple}${pro}
    <section class="card"><div class="card-h"><h2>Equity vs buy-and-hold</h2></div><div class="card-b"><div class="chart" id="eq"></div></div></section>`;
}
PR.bootSite({ shell: true, active: "desk" });
render();
function charts() {
  const uni = document.getElementById("uni"); if (!uni) return;
  const held = new Set(["NVDA","MSFT","LLY","COST","JPM","XOM"]);
  const rows = PR.data.tickers.map((t) => {
    const r = PR.rng(PR.hash(t))(); const d = (r - 0.46) * 4;
    return { s: t, d, held: held.has(t) };
  });
  window.__uni = rows;
  uni.innerHTML = rows.map((row) => {
    const bg = row.d >= 0 ? `color-mix(in srgb, var(--up) ${Math.round(18+Math.min(1,Math.abs(row.d)/3)*50)}%, var(--panel-2))` : `color-mix(in srgb, var(--down) ${Math.round(18+Math.min(1,Math.abs(row.d)/3)*50)}%, var(--panel-2))`;
    return `<button type="button" class="tile" data-sym="${row.s}" style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${bg};border:1px solid ${row.s==="NVDA"?"var(--gold)":"transparent"};font:600 10px var(--mono);color:inherit;cursor:pointer">${row.s}<span class="${PR.cls(row.d)}" style="font-weight:500">${row.d>=0?"+":""}${row.d.toFixed(1)}</span></button>`;
  }).join("");
  const tbody = document.querySelector("#uni-table tbody");
  const fillTable = (list) => { if (!tbody) return; tbody.innerHTML = list.map((row) => `<tr><td><button class="btn btn-sm" data-sym="${row.s}">${row.s}</button></td><td class="r num ${PR.cls(row.d)}">${row.d>=0?"+":""}${row.d.toFixed(1)}%</td><td>${row.held ? "Yes" : ""}</td></tr>`).join(""); };
  fillTable(rows);
  const table = document.getElementById("uni-table");
  if (table) table.onclick = (e) => {
    const th = e.target.closest("[data-sort]");
    if (!th) return;
    const key = th.dataset.sort;
    rows.sort((a, b) => key === "s" ? a.s.localeCompare(b.s) : b.d - a.d);
    fillTable(rows);
  };
  const n = 80, a = PR.series(n, 21, 100000, 104812, 0.004), s = PR.series(n, 9, 100000, 101880, 0.003);
  const el = document.getElementById("eq");
  if (el) PR.lineChart(el, { id: "dsk", height: 220, series: [{ data: a, color: "--gold", w: 2.2 }, { data: s, color: "--hold", w: 1.4, dash: true }], xlabels: ["Mon","Tue","Wed","Thu","Fri"], fmt: (v) => "$"+(v/1000).toFixed(1)+"k", tip: (i) => `<div class="num">Bot ${PR.usd(a[i],0)}</div><div class="num">SPY ${PR.usd(s[i],0)}</div>` });
  const ask = document.getElementById("ask"); if (ask) ask.onclick = () => PR.openDock("/explain NVDA ");
  const views = document.getElementById("views");
  if (views) views.onclick = (e) => { const b = e.target.closest("[data-v]"); if (!b) return; view = b.dataset.v; render(); charts(); };
  document.getElementById("main").onclick = (e) => {
    const b = e.target.closest("[data-sym]");
    if (!b) return;
    const row = (window.__uni || []).find((r) => r.s === b.dataset.sym) || { s: b.dataset.sym, d: 0, held: false };
    PR.openSheet(`<h2 style="margin:0 0 6px">${row.s}</h2><p class="num ${PR.cls(row.d)}" style="font-size:22px">${row.d>=0?"+":""}${row.d.toFixed(1)}% today</p><p>${row.held ? "The bot holds this name. A trailing stop is armed." : "The bot does not hold this name."}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-gold btn-sm" href="explainer.html">Why a decision</a><a class="btn btn-sm" href="markets.html">Open Markets</a></div>`, row.s);
  };
}
charts();
</script>
</body>
</html>
