<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk · PathRise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="site.css">
</head>
<body>
<div class="app"><main class="page" id="main"></main></div>
<script src="shared.js"></script><script src="site.js"></script>
<script>
const q = new URLSearchParams(location.search);
let view = q.get("empty") ? "empty" : (q.get("state") || "live");
function render() {
  if (view === "empty") {
    document.getElementById("main").innerHTML = `<section class="card state-card" style="display:flex"><div class="state-ico"><span data-i="agent" data-s="26"></span></div><h3>No bot yet</h3><p>Build your first bot with a template, or watch the demo learn before you spend a credit.</p><div class="state-actions"><a class="btn btn-gold" href="training.html">Build your first bot</a><a class="btn" href="arena.html?demo=1">Watch the demo</a></div></section>`;
    PR.hydrate(); return;
  }
  if (view === "offline") {
    document.getElementById("main").innerHTML = `<div class="banner" role="alert">The desk stream dropped at 15:41 ET. Paper stops are still live at the broker. <button class="btn btn-sm" id="retry">Retry</button></div>` + live();
    document.getElementById("retry").onclick = () => { view = "live"; render(); charts(); };
    return;
  }
  if (view === "collapse") {
    document.getElementById("main").innerHTML = `<div class="banner warn" role="status">The deterministic policy is holding about 94% of the time. Gating is not the cause. <a href="arena.html">Open the Arena</a> to raise exploration, or leave it and let the trailing stops work.</div>` + live();
    return;
  }
  document.getElementById("main").innerHTML = live();
}
function live() {
  return `<div class="page-head"><div><h1>Desk</h1><p>Balanced bot · paper · max 15% per name</p></div>
    <span class="pill gold"><i></i>Go-live locked</span><span class="pill up live"><i></i>Market open</span>
    <span style="flex:1"></span>
    <div class="seg" id="views"><button data-v="live">Live</button><button data-v="collapse">HOLD collapse</button><button data-v="offline">Stream down</button><button data-v="empty">Empty</button></div></div>
    <div class="grid-2">
      <a class="card" href="arena.html" style="display:block;color:inherit"><div class="card-h"><h2>Training now</h2><span class="pill gold"><i></i>Quick · step 12,288 / 20,000</span></div>
        <div class="card-b"><div class="meter"><i style="width:61%;background:var(--gold)"></i></div><p class="muted" style="margin:8px 0 0">Reward +0.62 · HOLD share falling · ETA 4 min. Open the Arena.</p></div></a>
      <section class="card"><div class="card-h"><h2>Go-live</h2><span class="pill warn"><i></i>2 of 5</span></div>
        <div class="card-b"><p class="muted" style="margin:0 0 8px">Paper days and the train/test gap are still open. Live routing stays off.</p><a class="btn btn-sm" href="oversight.html">Review checklist</a></div></section>
    </div>
    <div class="grid-main">
      <section class="card"><div class="card-h"><h2>Universe</h2><span class="sub">30 · today</span></div><div class="card-b"><div class="uni" id="uni" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px"></div><p class="muted" style="font-size:12px">Gold ring marks a name the bot holds. Cap is 15% of the book.</p></div></section>
      <section class="card"><div class="card-h"><h2>Agent decision</h2><span class="pill gold"><i></i>PPO · TCN</span></div>
        <div class="card-b"><div class="eyebrow">Inspecting NVDA</div><h2 style="margin:4px 0">BUY <span class="muted" style="font-size:14px">conf 0.31</span></h2>
        <p>Wants to add, but NVDA is already <b>7.2% of a 15% cap</b>. No order. Trailing stop stays armed at $115.28.</p>
        <div class="gate" style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill up"><i></i>Confidence high</span><span class="pill up"><i></i>Regime allows</span><span class="pill warn"><i></i>Size room left</span></div>
        <div style="display:flex;gap:8px;margin-top:12px"><a class="btn btn-gold btn-sm" href="explainer.html">Why this decision</a><button class="btn btn-sm" id="ask">Ask Clawbot</button></div></div></section>
      <section class="card"><div class="card-h"><h2>Risk budget</h2><span class="pill up"><i></i>Inside limits</span></div>
        <div class="card-b" style="display:grid;gap:10px"><div><div style="display:flex;justify-content:space-between"><span class="muted">Gross</span><b class="num">41% / 100%</b></div><div class="meter"><i style="width:41%;background:var(--gold)"></i></div></div>
        <div><div style="display:flex;justify-content:space-between"><span class="muted">Largest name</span><b class="num">7.2% / 15%</b></div><div class="meter"><i style="width:48%;background:var(--up)"></i></div></div>
        <div><div style="display:flex;justify-content:space-between"><span class="muted">Drawdown</span><b class="num">−1.8% / −25%</b></div><div class="meter"><i style="width:7%;background:var(--up)"></i></div></div></div></section>
    </div>
    <section class="card"><div class="card-h"><h2>Equity vs SPY</h2></div><div class="card-b"><div class="chart" id="eq"></div></div></section>`;
}
PR.bootSite({ shell: true, active: "desk" });
render();
function charts() {
  const uni = document.getElementById("uni"); if (!uni) return;
  const held = new Set(["NVDA","MSFT","LLY","COST","JPM","XOM"]);
  uni.innerHTML = PR.data.tickers.map((t) => {
    const r = PR.rng(PR.hash(t))(); const d = (r - 0.46) * 4;
    const bg = d >= 0 ? `color-mix(in srgb, var(--up) ${Math.round(18+Math.min(1,Math.abs(d)/3)*50)}%, var(--panel-2))` : `color-mix(in srgb, var(--down) ${Math.round(18+Math.min(1,Math.abs(d)/3)*50)}%, var(--panel-2))`;
    return `<a class="tile${held.has(t)?" held":""}" href="markets.html?s=${t}" style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${bg};border:1px solid ${t==="NVDA"?"var(--gold)":"transparent"};font:600 10px var(--mono)">${t}<span class="${PR.cls(d)}" style="font-weight:500">${d>=0?"+":""}${d.toFixed(1)}</span></a>`;
  }).join("");
  const n = 80, a = PR.series(n, 21, 100000, 104812, 0.004), s = PR.series(n, 9, 100000, 101880, 0.003);
  const el = document.getElementById("eq");
  if (el) PR.lineChart(el, { id: "dsk", height: 220, series: [{ data: a, color: "--gold", w: 2.2 }, { data: s, color: "--hold", w: 1.4, dash: true }], xlabels: ["Mon","Tue","Wed","Thu","Fri"], fmt: (v) => "$"+(v/1000).toFixed(1)+"k", tip: (i) => `<div class="num">Bot ${PR.usd(a[i],0)}</div><div class="num">SPY ${PR.usd(s[i],0)}</div>` });
  const ask = document.getElementById("ask"); if (ask) ask.onclick = () => PR.openDock("/explain NVDA ");
  document.getElementById("views").onclick = (e) => { const b = e.target.closest("[data-v]"); if (!b) return; view = b.dataset.v; render(); charts(); };
}
charts();
</script>
</body>
</html>
