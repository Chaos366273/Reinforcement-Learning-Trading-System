<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-factor · PathRise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="site.css">
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script><script src="site.js"></script>
<script>
document.getElementById("root").innerHTML = PR.authFrame({
  title: "Confirm it is you",
  lead: "This preview has no real authenticator. Open the desk, or type any 6 digits.",
  body: `<a class="btn btn-gold" href="desk.html">Open the desk</a>
    <form id="f"><div class="field" id="cf"><label for="code">Authenticator code</label><input id="code" class="num" inputmode="numeric" maxlength="6" placeholder="Any 6 digits"><span class="err">Use 6 digits, or tap Open the desk.</span></div>
    <button class="btn" type="submit">Continue with code</button></form>
    <a href="arena.html?state=finished">Watch a bot learn instead</a>`,
  foot: `<a href="login.html">Back to log in</a>`
});
PR.bootSite({ dock: false });
document.getElementById("f").onsubmit = (e) => {
  e.preventDefault();
  const c = document.getElementById("code").value.replace(/\s/g, "");
  if (c.length < 6) { document.getElementById("cf").classList.add("bad"); return; }
  location.href = "desk.html";
};
</script>
</body>
</html>
